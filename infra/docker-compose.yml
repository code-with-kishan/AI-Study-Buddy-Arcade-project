version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: studybuddy
      POSTGRES_USER: studybuddy
      POSTGRES_PASSWORD: studybuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://studybuddy:studybuddy@postgres:5432/studybuddy
      SECRET_KEY: dev-secret
      APP_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
